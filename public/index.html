<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProPlastControl - Inicio</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card-login {
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 text-center">
        
        <div class="card card-login p-4 p-md-5 shadow-lg">
          <div class="mb-4">
           <h1 class="fw-bold text-primary display-6 text-nowrap">ProPlastControl</h1>
            <p class="text-secondary small">Sistema de Gestión e Inventario para la Industria Plástica</p>
          </div>

          <form onsubmit="iniciarSesion(event)">
            <div class="form-floating mb-3 text-dark">
              <input type="email" class="form-control" id="correo" placeholder="name@example.com" value="admin@proplast.com" required>
              <label for="correo">Correo Electrónico</label>
            </div>
            
            <div class="form-floating mb-4 text-dark">
              <input type="password" class="form-control" id="password" placeholder="Contraseña" value="123456" required>
              <label for="password">Contraseña</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
              Ingresar al Sistema
            </button>
          </form>

          <div class="border-top border-secondary pt-3 mt-2">
            <a href="/dashboard.html" class="text-decoration-none text-light opacity-75 small">
              &rarr; Entrar directamente al Dashboard
            </a>
          </div>
        </div>

        <p class="text-muted small mt-4">&copy; 2026 ProPlastControl - Todos los derechos reservados</p>
      </div>
    </div>
  </div>

  <script>
    function iniciarSesion(e) {
      e.preventDefault();
      // Redirigir al panel de control tras el ingreso
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
